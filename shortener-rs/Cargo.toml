[package]
name = "shortener-rs"
version = "3.0.0"
edition = "2021"
description = "URL shortener — Rust parity implementation of the same API contract as the Python service"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
rand = "0.8"
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
